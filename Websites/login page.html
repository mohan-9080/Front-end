<!DOCTYPE html>
<html>
<head>
    <title> Login Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient;
            background-size:400% 400%;
            animation:bg 10s ease infinite;
        }

        
        .login-box{
            width:350px;
            padding:30px;
            text-align:center;
            background:rgba(255,255,255,0.15);
            backdrop-filter:blur(10px);
            border-radius:20px;
            box-shadow:0 0 25px rgba(0,0,0,0.3);
        }

        h1{
            color:white;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#ffffff;
            color:#6c5ce7;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        button:hover{
            transform:scale(1.05);
            transition:0.3s;
        }

        p{
            color:white;
            margin-top:15px;
        }

        a{
            color:#fff;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🔐 Login</h1>

    <form>

        <input type="text" placeholder="Username" required>

        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>
    <body style="background-image: url('https://images.rawpixel.com/image_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvdjEwMTYtYy0wMmQta3NoNnFkcWcuanBn.jpg'); background-size: cover;">


    <p>Don't have an account? <a href="#">Register</a></p>

</div>

</body>
</html>
