<!DOCTYPE html>
<html>
<head>
    <title>Project Reg Form</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #77b5eb;
        }

        .container{
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px gray;
        }

        h1{
            text-align: center;
            color: darkblue;
        }

        input, select, textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        button{
            width: 100%;
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Project Registration Form</h1>

    <form>

        <label>Student Name</label>
        <input type="text" placeholder="Enter Student Name">

        <label>Register Number</label>
        <input type="text" placeholder="Enter Register Number">

        <label>Department</label>
        <select>
            <option>ECE</option>
            <option>CSE</option>
            <option>EEE</option>
            <option>MECH</option>
            <option>CIVIL</option>
        </select>

        <label>Year of Study</label>
        <select>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <label>Email ID</label>
        <input type="email" placeholder="Enter Email">

        <label>Mobile Number</label>
        <input type="tel" placeholder="Enter Mobile Number">

        <label>Project Title</label>
        <input type="text" placeholder="Enter Project Title">

        <label>Project Domain</label>
        <select>
            <option>Embedded Systems</option>
            <option>IoT</option>
            <option>Artificial Intelligence</option>
            <option>Web Development</option>
            <option>Data Science</option>
        </select>

        <label>Project Guide Name</label>
        <input type="text" placeholder="Enter Guide Name">

        <label>Project Description</label>
        <textarea rows="4" placeholder="Enter Project Description"></textarea>

        <button type="submit">Register Project</button>

    </form>

</div>
    <body style="background-image: url('https://4kwallpapers.com/images/wallpapers/purple-abstract-5120x2880-24770.jpg'); background-size: cover;">


</body>
</html>
